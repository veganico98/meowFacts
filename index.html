<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Facts</title>
    <link rel="stylesheet" href="./src/styles/output.css">
    <link rel="stylesheet" href="./src/styles/animations.css">
</head>
<body class="relative overflow-x-hidden">
    <img class="absolute size-160 -z-10" src="./src/img/bg.webp" alt="">

    <div class="py-4 px-8 flex flex-col items-center">
        <div class="w-full sm:size-[80%] md:size-[60%] lg:size-[40%] xl:size-[30%] block z-10">
            <img id="logo" class="[filter:drop-shadow(6px_1px_0_var(--shadow-color))]" style="--shadow-color: #E58BFF" src="" alt="">
        </div>
        <section class="w-full flex flex-col items-center">
            <img class="size-40 relative left-30 top-0.5 md:-left-20" src="./src/img/gif1.gif" alt="gif">
            <div class="flex flex-col items-center justify-center">
                
                <img class="sm:size-[80%] md:size-[60%] rounded-2xl border-8 border-white shadow-2xl" id="catImage" src="https://cataas.com/cat" alt="Imagem bixano">

                <div class="flex flex-col gap-5 items-center justify-center">
                    <div class="w-full relative">
                        <img class="catGif absolute z-50 -top-20 left-0 size-20" src="./src/img/gif2.gif" alt="gif">
                        <div class="rounded-2xl p-4 bg-white w-full shadow-2xl relative z-10">
                            <p id="catFact" class="text-center text-purple-800">Clique no botão abaixo para gerar um fato sobre gatos.</p>
                        </div> 
                    </div>
                    <button id="next" class="bg-(--main-color) hover:bg-(--hover-color) active:bg-(--active-color) text-white font-bold px-4 py-1 border-4 border-white cursor-pointer rounded-lg shadow-2xl" style="--main-color:#E58BFF;--hover-color:#D367FF;--active-color:#BC13FF;">Novo Fato</button>
                </div>
            </div>
        </section>
        <img class="absolute size-120 -z-10 bottom-0 right-6" src="./src/img/bg.webp" alt="">
    </div>
</body>

<script type="module" src="./src/js/script.js"></script>

</html>
